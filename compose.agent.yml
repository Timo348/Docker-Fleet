name: docker-fleet-agent
services:
  agent:
    image: ${FLEET_IMAGE:-timo348/docker-fleet:1.0.0}
    build: .
    command: ['node', 'dist/agent/index.js']
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m, mode=1777]
    group_add: ['${DOCKER_GID:?Set DOCKER_GID to the Docker socket group ID}']
    ports:
      - '${AGENT_BIND_ADDRESS:?Set an explicit private host bind address}:${AGENT_PUBLISHED_PORT:-9443}:9443'
    environment:
      AGENT_HOST_ID: ${AGENT_HOST_ID:?Set the same unique host ID as the central config}
      AGENT_BIND: 0.0.0.0
      AGENT_PORT: 9443
      DOCKER_SOCKET: /var/run/docker.sock
      AGENT_TLS_CA: /secrets/agent-ca.pem
      AGENT_TLS_CERT: /secrets/server.pem
      AGENT_TLS_KEY: /secrets/server.key
      AGENT_ALLOWED_CLIENT_NAMES: ${AGENT_ALLOWED_CLIENT_NAMES:?Set the authorized backend certificate CN}
      AGENT_MAX_STREAMS: ${AGENT_MAX_STREAMS:-4}
      AGENT_MAX_LOG_BYTES: ${AGENT_MAX_LOG_BYTES:-2097152}
      AGENT_MAX_LINE_BYTES: ${AGENT_MAX_LINE_BYTES:-65536}
      AGENT_MAX_TAIL: ${AGENT_MAX_TAIL:-5000}
      AGENT_STREAM_SECONDS: ${AGENT_STREAM_SECONDS:-600}
      AGENT_COMPOSE_DIR: ${AGENT_COMPOSE_DIR:-}
      HEALTHCHECK_SERVER_NAME: ${AGENT_TLS_NAME:?Set the DNS name in the agent certificate SAN}
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ./secrets/remote-agent:/secrets:ro
    healthcheck:
      test: ['CMD', 'node', 'scripts/healthcheck.mjs', 'agent']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }
